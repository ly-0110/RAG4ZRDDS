# RAG4ZRDDS 一键起服务栈：后端（FastAPI REST + SSE）+ 前端（nginx 托管 + 反代）
#
# 交付形态：**镜像自包含**——代码、依赖、Node 产物、六套索引、PDF/HTML 原文、模型权重全在镜像里。
# 所以起栈只需要两样外部东西：Docker，以及一个 LLM 后端（云端 API 或宿主上的 Ollama）。
# 换台机器 / 换系统：把镜像带过去即可（docker save / load，见 README），不需要拷贝任何本机目录。
#
# 起停：
#   cp .env.example .env             # 1) 先填 LLM_BASE_URL / LLM_API_KEY / LLM_MODEL（密钥不进镜像）
#   make docker-serve                # 2) 构建镜像并后台启动
#   make docker-smoke                # 3) 冒烟验收（15 项，全过退出码 0）
#   docker compose logs -f backend   #    看启动期预热日志（live 含 bge-m3 冷加载）
#   docker compose down              #    停栈
#
# 构建期需要"权重来源"两个目录（additional_contexts）：本机已下载的模型缓存。
# 这是**构建期**依赖而非运行期依赖——镜像一旦构建完成，换机器就不再需要它们。
# 缓存不在默认位置时：
#   LLAMA_INDEX_CACHE_HOST=<LlamaIndex 缓存> HF_CACHE_HOST=<HF 缓存的 hub 目录> make docker-serve
# 目标机器上没有这些缓存、又允许联网：改用精简形态（IMAGE_TARGET=slim，见 README）。
name: rag4zrdds

services:
  backend:
    build:
      context: .
      # 默认 selfcontained（权重烘进镜像）；slim = 不烘权重、首次启动下载
      target: ${IMAGE_TARGET:-selfcontained}
      # 权重来源（构建期读取，不进最终镜像的额外体积——它们本身就是镜像内容）
      additional_contexts:
        # embedding 权重：LlamaIndex 缓存（HuggingFaceEmbedding 会显式传自己的 cache_dir）
        llama-cache: "${LLAMA_INDEX_CACHE_HOST:-$LOCALAPPDATA/llama_index/llama_index/Cache}"
        # 精排权重：HF 缓存的 hub 目录（CrossEncoder 走 HF 默认缓存）
        hf-cache: "${HF_CACHE_HOST:-$USERPROFILE/.cache/huggingface/hub}"
      args:
        PIP_INDEX: ${PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: rag4zrdds-backend:latest
    container_name: rag4zrdds-backend
    # .env 注入密钥与运行配置；required:false 让 mock 形态在无 .env 时也能起
    # （live 形态缺 LLM 配置会在启动期给可读拒绝，不静默降级）。
    # 第二份 .env.docker（可选，同样不入 Git）覆盖 .env —— 用于"宿主与容器配置不同"的项，
    # 最典型的是本地 LLM 地址：宿主写 127.0.0.1，容器要写 host.docker.internal，
    # 放在这里就不必来回改 .env。
    env_file:
      - path: .env
        required: false
      - path: .env.docker
        required: false
    environment:
      # 容器内必须绑 0.0.0.0。宿主 .env 的 APP_HOST=127.0.0.1 在容器里只绑环回，
      # 端口映射会变成"映射了却连不上"。environment 优先级高于 env_file，此处覆盖生效。
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      # 宿主 .env 默认 mock（供前端脱离后端联调）；容器形态默认 live。
      # 要起 mock：CONTAINER_RAG_MODE=mock make docker-serve
      RAG_MODE: ${CONTAINER_RAG_MODE:-live}
      LOG_DIR: logs
      # 权重已烘进镜像 → 默认离线，避免 SentenceTransformer 初始化反复联网（本机实测会"看似卡死"）。
      # 精简形态（IMAGE_TARGET=slim）必须反过来：HF_OFFLINE=0 make docker-serve
      HF_HUB_OFFLINE: ${HF_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${HF_OFFLINE:-1}
      PYTHONUNBUFFERED: "1"
    volumes:
      # 唯一挂载：运行期日志（请求 / 检索 / 引用回查 / 反馈）落宿主，容器重建不丢。
      # 知识库与权重不挂载——它们已在镜像内，这正是"换机器也能跑"的前提。
      - ./logs:/app/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      # 用 python 而非 curl：基础镜像不必为健康检查多装一个包
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # live 启动含 bge-m3 冷加载 + 启动期预热（实测约 8s，首次可能更久）
      start_period: 180s
    restart: unless-stopped
    # 容器内访问宿主的地址：用本地 Ollama 后端时，把
    #   LLM_BASE_URL=http://host.docker.internal:11500/v1
    # 写进 .env.docker（容器侧覆盖，见上方 env_file；容器里的 127.0.0.1 指容器自身）。
    # 云端 API 后端不受影响。
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: web/RAG4ZRDDS
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: rag4zrdds-frontend:latest
    container_name: rag4zrdds-frontend
    # 只定启动顺序：不因后端未 healthy 而卡住前端（nginx 延迟解析后端地址，
    # 后端预热期间前端页面照常可开，接口稍后就绪）
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-5173}:80"
    restart: unless-stopped
