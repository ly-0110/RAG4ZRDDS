# RAG4ZRDDS 一键起服务栈：后端（FastAPI REST + SSE）+ 前端（nginx 托管 + 反代）
#
# 前置（各一次）：
#   1) cp .env.example .env 并填 LLM_BASE_URL / LLM_API_KEY / LLM_MODEL（密钥只留在 .env，不进镜像）
#   2) 模型权重缓存无需配置：默认按 Windows 用户目录挂载（bge-m3 在 LlamaIndex 缓存、
#      精排权重在 HF 缓存，两处见下方 volumes 注释）。放在别处或非 Windows：
#      LLAMA_INDEX_CACHE_HOST=<绝对路径> HF_CACHE_HOST=<绝对路径> docker compose up -d
#   3) 索引由 make index 预先建好（indexes/ 挂载复用），或首次启动时由服务端按配置重建
#
# 起停：
#   docker compose up -d --build     # 构建镜像并后台启动
#   docker compose logs -f backend   # 看启动期预热日志（live 模式含 bge-m3 冷加载）
#   docker compose down              # 停止并移除容器（不动挂载的宿主目录）
#
# 镜像口径：只装代码 + 依赖。bge-m3 权重、六套索引、HTML 原始快照全部挂载复用宿主，
# 因此重新构建镜像不需要重新下载模型或重建索引。
name: rag4zrdds

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX: ${PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: rag4zrdds-backend:latest
    container_name: rag4zrdds-backend
    # .env 注入密钥与运行配置；required:false 让 mock 形态在无 .env 时也能起
    # （live 形态缺 LLM 配置会在启动期给可读拒绝，不静默降级）。
    # 第二份 .env.docker（可选，同样不入 Git）覆盖 .env —— 用于"宿主与容器配置不同"的项，
    # 最典型的是本地 LLM 地址：宿主写 127.0.0.1，容器要写 host.docker.internal，
    # 放在这里就不必来回改 .env。
    env_file:
      - path: .env
        required: false
      - path: .env.docker
        required: false
    environment:
      # 容器内必须绑 0.0.0.0。宿主 .env 的 APP_HOST=127.0.0.1 在容器里只绑环回，
      # 端口映射会变成"映射了却连不上"。environment 优先级高于 env_file，此处覆盖生效。
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      # 宿主 .env 默认 mock（供前端脱离后端联调）；容器形态默认 live。
      # 要起 mock：CONTAINER_RAG_MODE=mock docker compose up -d
      RAG_MODE: ${CONTAINER_RAG_MODE:-live}
      LOG_DIR: logs
      # ── 模型权重缓存（两个，位置不同，都要挂）──
      # embedding（bge-m3）经 LlamaIndex 的 HuggingFaceEmbedding 加载，而 LlamaIndex 会
      # 显式传自己的 cache_dir，所以权重落在 **LlamaIndex 缓存**而非 HF 默认缓存；
      # 精排（bge-reranker-v2-m3）走 sentence-transformers CrossEncoder，用 HF 默认缓存。
      # 容器内固定路径 + 挂载宿主同名内容，两处都在离线模式下命中。
      HF_HOME: /root/.cache/huggingface
      LLAMA_INDEX_CACHE_DIR: /root/.cache/llama_index
      # 权重已在宿主缓存：离线模式避免 SentenceTransformer 初始化反复联网（本机实测会"看似卡死"）。
      # 需要重新下载权重时：HF_OFFLINE=0 docker compose up -d（此时须能直连 huggingface.co）
      HF_HUB_OFFLINE: ${HF_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${HF_OFFLINE:-1}
      PYTHONUNBUFFERED: "1"
    # 容器内访问宿主的地址：用本地 Ollama 后端时，把
    #   LLM_BASE_URL=http://host.docker.internal:11500/v1
    # 写进 .env.docker（容器侧覆盖，见上方 env_file；容器里的 127.0.0.1 指容器自身）。
    # cloud API 后端不受影响。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 六套索引：live 检索必需。读写挂载——chroma 打开持久化集合会写 sqlite 日志，
      # 只读挂载会失败。缺索引时服务端会按实验配置尝试重建（约 8~25 分钟/套）。
      - ./indexes:/app/indexes
      # HTML 原始快照：/documents/{source_id}/{filename} 据实验配置的 sources[].path 提供"打开原文"。
      # 该目录不入 Git，未挂载时引用链接会退回配置里的占位地址（不报错、不静默改语义）。
      - ./data/raw:/app/data/raw:ro
      # 四级日志（requests / retrievals / sources / feedback）落宿主，容器重建不丢
      - ./logs:/app/logs
      # bge-m3 权重缓存（约 2.3GB）：复用宿主已下载的，避免镜像膨胀与重复下载。
      # LlamaIndex 缓存的宿主默认位置（Windows）= %LOCALAPPDATA%\llama_index\llama_index\Cache；
      # 非 Windows 或缓存在他处：LLAMA_INDEX_CACHE_HOST=<绝对路径> docker compose up -d
      - ${LLAMA_INDEX_CACHE_HOST:-$LOCALAPPDATA/llama_index/llama_index/Cache}:/root/.cache/llama_index:ro
      # HF 缓存：精排权重（bge-reranker-v2-m3，约 2.2GB）在此。
      # Windows 默认取 %USERPROFILE%\.cache\huggingface；非 Windows：HF_CACHE_HOST=<绝对路径>
      - ${HF_CACHE_HOST:-$USERPROFILE/.cache/huggingface}:/root/.cache/huggingface:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      # 用 python 而非 curl：基础镜像不必为健康检查多装一个包
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # live 启动含 bge-m3 冷加载 + 启动期预热（本机实测约 8s，容器首轮可能更久）
      start_period: 180s
    restart: unless-stopped

  frontend:
    build:
      context: web/RAG4ZRDDS
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: rag4zrdds-frontend:latest
    container_name: rag4zrdds-frontend
    # 只定启动顺序：不因后端未 healthy 而卡住前端（nginx 延迟解析后端地址，
    # 后端预热期间前端页面照常可开，接口稍后就绪）
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-5173}:80"
    restart: unless-stopped
