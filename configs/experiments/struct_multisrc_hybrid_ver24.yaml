# =====================================================================
# RAG4ZRDDS 实验配置 · 第四周 Version-aware（指南 §8.3）
# 多来源 Hybrid + v2.4 软偏好：version_pref/version_boost 生效时，
# 候选池内归一化分给命中 v2.4 的节点 +0.1（对照 struct_multisrc_hybrid）。
# =====================================================================
schema_version: 1

experiment:
  name: struct_multisrc_hybrid_ver24
  description: 第四周 Version-aware：多来源 Hybrid + v2.4 软偏好（version_pref/version_boost）
  stage: ablation

sources:
  - id: user_manual
    type: pdf
    path: data/raw/manuals/ZRDDS用户手册.pdf
    version: "2.0"
  - id: zrdds_dev_guide
    type: html
    path: data/raw/developer-guides/cdoc_html
    version: "2.4"
    url: https://docs.zrtechnology.com/cdoc/html

ingest:
  cleaned_output: data/cleaned/pages.jsonl
  quality_check: true

chunking:                          # 与两个子配置一致（同一节点集）
  method: struct
  version: v1
  params:
    max_chunk_chars: 2500
    overlap_chars: 200
    large_section_thresh: 2500

embedding:
  provider: local
  model: bge-m3
  batch_size: 32
  device: cpu

index:
  backend: chroma
  metric: cosine

retrieval:
  mode: hybrid
  top_k: 5
  candidate_top_k: 30
  filters: {}
  params:
    rrf_k: 60
    version_pref: "2.4"
    version_boost: 0.1
  components:
    vector: struct_multisrc_v1
    bm25: struct_multisrc_bm25

generation:
  enabled: false
  prompt_version: v2               # 与 struct_multisrc_v1 对齐（多来源臂 prompt 须一致；gen 关闭无功能影响）
  llm_env_prefix: LLM_

evaluation:
  # 多来源评测口径同 struct_multisrc_v1（12 题跨来源集 + 25 条标注；make audit-multisrc → pass）
  dataset: evaluation/datasets/questions_multisource.jsonl
  expected_sources: evaluation/datasets/expected_sources_multisource.jsonl
  retrieval_metrics: [hit_rate@5, mrr@5]
  response_metrics: []
  sample_size: null

report:
  dir: evaluation/reports
  compare_baseline: struct_multisrc_hybrid
