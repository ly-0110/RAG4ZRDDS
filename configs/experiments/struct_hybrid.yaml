# =====================================================================
# RAG4ZRDDS 实验配置 · Hybrid RRF（struct_hybrid）
# 引用制：无自有索引，components 引用 struct_v1(vector)
# 与 struct_bm25(bm25) 两个既有索引，RRF 运行时融合——零重建。
#   * build_index 对 hybrid 自动跳过（子索引由各自配置构建）
#   * rrf_k 放 retrieval.params：score = Σ 1/(rrf_k + rank)
#   * 指标依赖真值标注；标注未就绪时置 expected_sources: null，只记检索明细
# =====================================================================
schema_version: 1

experiment:
  name: struct_hybrid
  description: Hybrid RRF：struct_v1(向量) + struct_bm25(词袋) 引用融合
  stage: ablation

sources:
  - id: user_manual
    type: pdf
    path: data/raw/manuals/ZRDDS用户手册.pdf
    version: "2.0"

ingest:
  cleaned_output: data/cleaned/pages.jsonl
  quality_check: true

chunking:                          # 与 struct_v1/struct_bm25 完全一致（同一节点集）
  method: struct
  version: v1
  params:
    max_chunk_chars: 2500
    overlap_chars: 200
    large_section_thresh: 2500

embedding:                         # 与 struct_v1 一致（向量路消费；hybrid 命名沿用）
  provider: local
  model: bge-m3
  batch_size: 32
  device: cpu

index:
  backend: chroma
  metric: cosine

retrieval:
  mode: hybrid
  top_k: 5
  candidate_top_k: 30              # 两路子检索各取条数（融合粗取池）
  filters: {}
  params:
    rrf_k: 60                      # RRF 常数（经典值 60）
  components:                      # 引用制：实验名 → configs/experiments/<名>.yaml
    vector: struct_v1
    bm25: struct_bm25

generation:
  enabled: false                   # 热身只验检索路径，不跑生成（省 LLM 配额）
  prompt_version: v2
  llm_env_prefix: LLM_

evaluation:
  dataset: evaluation/datasets/questions.jsonl
  expected_sources: evaluation/datasets/expected_sources.jsonl
                                   # 同分块（struct）三模式对照：vector / bm25 / hybrid
                                   # 共用同一 120 题标注集（2026-09-17 接线）
  
  retrieval_metrics: [hit_rate@5, mrr@5, precision@5, recall@5]
  response_metrics: []
  sample_size: null

report:
  dir: evaluation/reports
  compare_baseline: struct_v1      # 单来源基线对照（热身期指标为空，仅记录检索明细）
