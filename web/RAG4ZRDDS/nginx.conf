# 前端容器 nginx 配置：托管 Vite 构建产物 + 反代后端 API（含 SSE 流式问答）
#
# 代理路径与开发态 vite.config.js 的 proxy 一一对应（共 6 条），
# 因此前端代码里的相对路径请求在开发态与容器态行为一致。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 用变量 + Docker 内嵌 DNS 延迟解析：后端容器尚未就绪时 nginx 照常启动
    # （直接写死 upstream 主机名会在启动期解析失败并拒绝启动）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rag_backend "backend:8000";

    # ---- 静态产物 ----
    # 构建产物名带内容哈希，可长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 问答流（SSE）----
    # 必须关闭缓冲：否则 token 流会被 nginx 攒成一坨再下发，
    # 前端的打字机效果与"停止生成"（客户端 abort）都会失效。
    location = /query {
        proxy_pass http://$rag_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;

        # 长回答（本机实测单题可达数十秒）+ 上游 LLM 出词间隔
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # ---- 其余 API ----
    # /sources 引用回查 · /nodes 单节点原文 · /documents 本地文档原文（HTML 快照可达数百 KB）
    # · /healthz 健康检查 · /feedback 反馈落库
    location ~ ^/(sources|nodes|documents|healthz|feedback)(/|$) {
        proxy_pass http://$rag_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- SPA 兜底 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
